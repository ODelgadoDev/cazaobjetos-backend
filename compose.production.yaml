services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: cazaobjetos
      POSTGRES_USER: cazaobjetos
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el entorno de producción}
    volumes:
      - production_db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U cazaobjetos -d cazaobjetos]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - production_push_keys:/app/.local
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      DB_URL: jdbc:postgresql://db:5432/cazaobjetos
      DB_USER: cazaobjetos
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      SERVER_ADDRESS: 0.0.0.0
      COOKIE_SECURE: "true"
      PUSH_KEY_FILE: /app/.local/vapid.properties
      PUSH_ENABLED: ${PUSH_ENABLED:-true}
      PUSH_SUBJECT: ${PUSH_SUBJECT:-https://utch.edu.mx}
      FRONTEND_URL: ${FRONTEND_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
volumes:
  production_db:
  production_push_keys:
