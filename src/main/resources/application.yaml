server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:true}
  error:
    include-message: never

url:
  api: /api/v1

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: cazaobjetos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cazaobjetos}
    username: ${DB_USER:cazaobjetos}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    time-zone: UTC

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
